<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IsaMig ChatBot</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#edf4f2;color:#17352f}header{background:#075e54;color:white;padding:28px}main{max-width:850px;margin:auto;padding:20px}section{background:white;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 4px 18px #1231}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #bbb}input{width:100%;margin-bottom:10px}button{background:#075e54;color:white}small{color:#53645f}#out{white-space:pre-wrap;line-height:1.6}</style></head><body><header><small style="color:white">ISAMIG SOLUÇÕES DIGITAIS</small><h1>IsaMig ChatBot</h1>Central de atendimento inteligente</header><main><section><h2>Conexão WhatsApp</h2><p>● Desconectado</p><p>O pareamento por QR Code depende da implantação do servidor.</p><button disabled>Conectar (em desenvolvimento)</button></section><section><h2>Simulador de atendimento</h2><p>Ambiente demonstrativo. Não insira dados reais de clientes.</p><form id="form"><input id="msg" required maxlength="2000" placeholder="Digite uma mensagem de teste"><button>Simular resposta</button></form><p id="out" aria-live="polite"></p></section></main><script>document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const t=document.querySelector('#msg').value.toLowerCase();document.querySelector('#out').textContent=/atendente|humano|parar|cancelar/.test(t)?'Solicitação de atendimento humano registrada apenas nesta simulação.':/aposent|pension/.test(t)?'Você já possui empréstimo consignado ou seria o primeiro? Não envie documentos ou dados pessoais.':/empréstimo|emprestimo|consignado/.test(t)?'Olá! Você recebe aposentadoria ou pensão do INSS? A contratação depende de análise.':'Olá! Sou o assistente virtual IsaMig. Como posso ajudar?'})</script></body></html>
